<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ورود به پنل مدیریت | AMIR_SR5</title>
<meta name="robots" content="noindex, nofollow">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --gold:#C9A84C;
  --gold-light:#E8C96A;
  --black:#080808;
  --dark:#111;
  --dark2:#1A1A1A;
  --text:#E8E8E8;
  --text-muted:#888;
  --red:#ef4444;
  --green:#22c55e;
}
body{
  font-family:'Segoe UI',Tahoma,sans-serif;
  background:var(--black);
  color:var(--text);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:1rem;
}
.particles{
  position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;
}
.particles span{
  position:absolute;
  width:2px;height:2px;
  background:var(--gold);
  border-radius:50%;
  opacity:0.3;
  animation:float linear infinite;
}
@keyframes float{
  0%{transform:translateY(100vh) scale(0);opacity:0}
  10%{opacity:0.4}
  90%{opacity:0.2}
  100%{transform:translateY(-20px) scale(1);opacity:0}
}
.login-box{
  position:relative;z-index:1;
  background:var(--dark2);
  border:1px solid rgba(201,168,76,0.2);
  border-radius:16px;
  padding:2.5rem 2rem;
  width:100%;max-width:400px;
  box-shadow:0 25px 60px rgba(0,0,0,0.6);
}
.logo-wrap{
  text-align:center;margin-bottom:2rem;
}
.logo-wrap img{
  width:72px;height:72px;
  border-radius:50%;
  border:2px solid var(--gold);
  box-shadow:0 0 20px rgba(201,168,76,0.4);
  margin-bottom:1rem;
}
.logo-wrap h1{
  font-size:1.1rem;
  color:var(--gold);
  letter-spacing:3px;
  font-family:'Orbitron','Segoe UI',sans-serif;
}
.logo-wrap p{
  font-size:12px;
  color:var(--text-muted);
  margin-top:4px;
}
.form-group{
  margin-bottom:1.2rem;
}
label{
  display:block;
  font-size:12px;
  color:var(--text-muted);
  margin-bottom:6px;
  letter-spacing:1px;
}
input{
  width:100%;
  padding:12px 14px;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(201,168,76,0.2);
  border-radius:8px;
  color:var(--text);
  font-size:14px;
  font-family:inherit;
  transition:border-color 0.3s;
  outline:none;
  direction:ltr;
}
input:focus{border-color:var(--gold)}
input::placeholder{color:var(--text-muted)}
.btn-login{
  width:100%;
  padding:13px;
  background:var(--gold);
  color:#000;
  border:none;
  border-radius:8px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  transition:all 0.3s;
  font-family:inherit;
  margin-top:0.5rem;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}
.btn-login:hover{background:var(--gold-light);transform:translateY(-1px)}
.btn-login:disabled{opacity:0.6;cursor:not-allowed;transform:none}
.alert{
  padding:10px 14px;
  border-radius:8px;
  font-size:13px;
  margin-bottom:1rem;
  display:none;
}
.alert.error{
  background:rgba(239,68,68,0.1);
  border:1px solid rgba(239,68,68,0.3);
  color:#fca5a5;
}
.alert.success{
  background:rgba(34,197,94,0.1);
  border:1px solid rgba(34,197,94,0.3);
  color:#86efac;
}
.spinner{
  width:16px;height:16px;
  border:2px solid rgba(0,0,0,0.3);
  border-top-color:#000;
  border-radius:50%;
  animation:spin 0.6s linear infinite;
  display:none;
}
@keyframes spin{to{transform:rotate(360deg)}}
.back-link{
  text-align:center;
  margin-top:1.5rem;
}
.back-link a{
  color:var(--text-muted);
  font-size:12px;
  text-decoration:none;
  transition:color 0.3s;
}
.back-link a:hover{color:var(--gold)}
/* Config notice */
.config-notice{
  background:rgba(201,168,76,0.08);
  border:1px solid rgba(201,168,76,0.2);
  border-radius:8px;
  padding:12px;
  font-size:12px;
  color:var(--text-muted);
  margin-bottom:1.5rem;
  display:none;
}
</style>
</head>
<body>

<div class="particles" id="particles"></div>

<div class="login-box">
  <div class="logo-wrap">
    <img src="../icon.png" alt="SR5" onerror="this.style.display='none'">
    <h1>AMIR_SR5</h1>
    <p>پنل مدیریت — فقط ادمین</p>
  </div>

  <div class="config-notice" id="configNotice">
    ⚠️ برای فعال‌سازی، فایل <code>config.js</code> را تنظیم کنید.
  </div>

  <div class="alert error" id="errorAlert"></div>
  <div class="alert success" id="successAlert"></div>

  <div class="form-group">
    <label>ایمیل</label>
    <input type="email" id="email" placeholder="admin@example.com" autocomplete="email">
  </div>

  <div class="form-group">
    <label>رمز عبور</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
  </div>

  <button class="btn-login" id="loginBtn" onclick="handleLogin()">
    <span class="spinner" id="spinner"></span>
    <span id="btnText">ورود به پنل</span>
  </button>

  <div class="back-link">
    <a href="../">← بازگشت به سایت</a>
  </div>
</div>

<script src="config.js?v=2"></script>
<script>
// ============================================================
// Supabase Init — credentials از config.js میان
// ============================================================
let supabaseClient = null;

function initSupabase() {
  if (typeof SUPABASE_URL === 'undefined' || typeof SUPABASE_ANON_KEY === 'undefined') {
    document.getElementById('configNotice').style.display = 'block';
    return false;
  }
  try {
    supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    return true;
  } catch(e) {
    showError('خطا در اتصال به Supabase: ' + e.message);
    return false;
  }
}

// ============================================================
// Check if already logged in
// ============================================================
async function checkSession() {
  if (!initSupabase()) return;
  try {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) {
      window.location.href = 'dashboard.html';
    }
  } catch(e) {
    console.log('Session check:', e.message);
  }
}

// ============================================================
// Login handler
// ============================================================
async function handleLogin() {
  if (!supabaseClient) {
    if (!initSupabase()) {
      showError('Supabase پیکربندی نشده. فایل config.js را بررسی کنید.');
      return;
    }
  }

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  if (!email || !password) {
    showError('لطفاً ایمیل و رمز عبور را وارد کنید.');
    return;
  }

  setLoading(true);
  hideAlerts();

  try {
    const { data, error } = await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

    if (error) {
      if (error.message.includes('Invalid login')) {
        showError('ایمیل یا رمز عبور اشتباه است.');
      } else {
        showError('خطا: ' + error.message);
      }
      setLoading(false);
      return;
    }

    if (data?.session) {
      showSuccess('ورود موفق — در حال انتقال...');
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 800);
    }
  } catch(e) {
    showError('خطای شبکه: ' + e.message);
    setLoading(false);
  }
}

// ============================================================
// UI Helpers
// ============================================================
function setLoading(on) {
  const btn = document.getElementById('loginBtn');
  const spinner = document.getElementById('spinner');
  const text = document.getElementById('btnText');
  btn.disabled = on;
  spinner.style.display = on ? 'block' : 'none';
  text.textContent = on ? 'در حال ورود...' : 'ورود به پنل';
}

function showError(msg) {
  const el = document.getElementById('errorAlert');
  el.textContent = msg;
  el.style.display = 'block';
}

function showSuccess(msg) {
  const el = document.getElementById('successAlert');
  el.textContent = msg;
  el.style.display = 'block';
}

function hideAlerts() {
  document.getElementById('errorAlert').style.display = 'none';
  document.getElementById('successAlert').style.display = 'none';
}

// Enter key support
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') handleLogin();
});

// ============================================================
// Particles
// ============================================================
const container = document.getElementById('particles');
for (let i = 0; i < 30; i++) {
  const s = document.createElement('span');
  s.style.left = Math.random() * 100 + '%';
  s.style.animationDuration = (Math.random() * 8 + 6) + 's';
  s.style.animationDelay = (Math.random() * 8) + 's';
  container.appendChild(s);
}

// Init
checkSession();
</script>
</body>
</html>
